server {
  listen 80;
  root /usr/share/nginx/html;

  # index.html은 매번 새로 받아 새 빌드(해시가 바뀐 assets)를 바로 반영한다.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # assets는 파일 이름에 해시가 들어가므로 오래 캐시해도 된다.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri /index.html;
  }
}
