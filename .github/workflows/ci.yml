# 협업 규칙 §7 CI 파이프라인.
#   PR(→ dev, → main), dev push : eslint · tsc · vitest · build + 이미지 빌드 (push 안 함)
#   main push(머지)             : 같은 검사 → 이미지 push  ghcr.io/devoops-team/frontend:{main, sha-<7자리>}
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/devoops-team/frontend

jobs:
  check:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: eslint
        run: npm run lint
      - name: tsc --noEmit
        run: npm run typecheck
      - name: vitest
        run: npm test
      - name: build
        run: npm run build

  image:
    name: image
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-,format=short
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 백엔드 주소는 번들에 들어간다. 배포 주소가 정해지면 레포 변수 VITE_API_BASE에 넣는다.
          build-args: |
            VITE_API_BASE=${{ vars.VITE_API_BASE || 'http://localhost:8080' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
